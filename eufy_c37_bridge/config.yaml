name: Eufy C37 Bridge
version: "0.5.0"
slug: eufy_c37_bridge
description: Bilder der eufyCam C37 über das eufy-sdk für Home Assistant (Generic Camera)
url: https://github.com/drome79/ha-addons
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
host_network: true
services:
  - mqtt:want
options:
  email: ""
  password: ""
  country: DE
  cameras: []
  refresh_minutes: 30
  min_live_interval_minutes: 10
  live_max_minutes: 5
  port: 8099
  captcha_answer: ""
  verify_code: ""
schema:
  email: email
  password: password
  country: str
  cameras:
    - str?
  refresh_minutes: int(0,1440)
  min_live_interval_minutes: int(1,1440)
  live_max_minutes: int(1,60)?
  transcode_height: int(360,2160)?
  port: port
  captcha_answer: str?
  verify_code: str?
