name: Eufy C37 Bridge
version: "0.12.5"
slug: eufy_c37_bridge
description: Bilder der eufyCam C37 über das eufy-sdk für Home Assistant (Generic Camera)
url: https://github.com/drome79/eufy-c37-bridge
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
host_network: true
ingress: true
ingress_port: 8099
panel_icon: mdi:cctv
panel_title: Eufy Bridge
hassio_api: true
services:
  - mqtt:want
options:
  email: ""
  password: ""
  country: DE
  cameras: []
  full_support: false
  refresh_minutes: 30
  min_live_interval_minutes: 10
  live_max_minutes: 5
  prewarm_seconds: 45
  port: 8099
  captcha_answer: ""
  verify_code: ""
schema:
  email: email
  password: password
  country: str
  cameras:
    - str?
  full_support: bool?
  refresh_minutes: int(0,1440)
  min_live_interval_minutes: int(1,1440)
  live_max_minutes: int(1,60)?
  prewarm_seconds: int(0,300)?
  transcode_height: int(360,2160)?
  extra_devices: bool?
  port: port
  captcha_answer: str?
  verify_code: str?
